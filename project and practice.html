        /* 时间轴样式 —— 沿用原网站的配色和字体 */

    <script>
    /* ===== 在这里改内容 =====
       key:true  → 标为“我的决策点”（实心节点 + 徽章）
       todo      → 待回忆的提示，写完后删掉这一行

    var PROJECTS = [
  {
    id: "xian",
    tab: "校园话剧展演",
    title: "校园话剧展演",
    hook: "为参与校园文化活动，展示本系的形象与风采，我参与了话剧的策划与演出。这是一部关于成长与自我选择的校园原创话剧，名字叫LIGNE（《线》）。",
    meta: "2021.4-5",
    steps: [
      {
        stage: "第一步",
        name: "立意与构思",
        text: "  迈过18岁这一象征成年的数字以后会发生什么呢？被师长耳提面命、全副身心都投入到考试与学习的日子似乎已经成为过去，能独当一面、游刃有余地生活在现实世界里的日子似乎还离我们有些距离。这是一段青涩、迷茫，但迫切渴望成长、需要被看见的时光，其中有太多事情需要我们自己真正做出选择，因为这关乎自我的形成；但做出这些选择的时候，我们又无法真正把家庭的期待、外界的评价体系与亲密关系摈除在外。身处这样千头万绪的时刻，就如面对着一团乱线，这些线牵制也牵绊着我们。我们可以理清它们，寻找到属于自己的一条吗？<br />  这一校园活动的主旨是“展示团体形象”，因此我们需要策划一个可以体现法语系形象的表演。同学们一致认为话剧或歌舞剧是能够展现法语系气质的选择，于是确定我们要原创一台话剧，自愿参与话剧策划的同学组成了策划团队。关于话剧主题的选择，有同学提出可以参考一些著名的剧本，比如像《玩偶之家》娜拉出走那样；有同学则认为要贴近现实生活比较好，加入一些喜剧元素更好。我提出可以参照《玩偶之家》关于“人的解放”的内核，创作一个现实人物追求独立、平等，寻找自我，承担自我责任的故事，或者说是一个校园版的娜拉出走故事，那么在其中也可以加入现实元素，制作一些幽默的内容让话剧更接地气。<br />  经过一番讨论和投票以后，确定了最终的主题，我们会以刚满18岁上大学的女主角航思作为我们团体形象的代表，根据她的故事来探讨我们该如何在这个特别的阶段进行选择与成长。同时选取“线”这一意象为标题，一是想指代18岁这一条重要的年龄分界线，二是指代那些影响我们选择与成长的人或事物，它们就像一团乱麻，也像牵动着木偶行为的线。"
      },
      {
        stage: "第二步",
        name: "剧本共创",
        text: "  主题确定后，剧本内容由策划团队的同学分头创作。与主角成长密切相关的父母、师长与恋爱三个层面作为前三幕，每一幕都会在航思身上缠上几根红线，作为一种象征意义；最后一幕主角挣脱红线，表面这是一个摆脱束缚、确定本心的场景，以集体合唱一首法语歌曲呈现。<br />主角航思是一个品学兼优、沉稳内敛的女孩。但好学生的表面下，是一颗热爱音乐、渴望一种别样生活的叛逆心灵。她生活在一个传统的家庭，父母认为学生最要紧的任务是学习，因此她在家里弹吉他或者唱歌，都会被认为是不务正业。父母一个唱红脸，一个唱白脸，都严格要求航思不能把时间用于“玩乐”。他们认为音乐容易让人误入歧途，只有日后考上好大学、找到好工作、稳定下来以后，才适合做这些消遣活动。<br />  在航思的校园里，老师的态度则更具体而现实。得知航思喜欢音乐，并立志走上这条道路时，老师表示不认可，并试图说服她——你成绩那么好，难道要当一个艺术生吗？何必把过多的心思花在这些旁门左道上？把分数提高，考个好大学，为校争光才是重要的事情。<br />  到了大学以后，航思终于松了口气，她觉得自己可以慢慢拾起这份热爱。她向恋爱中的男友袒露了过去的无奈，以及对音乐的期待与热爱，希望得到理解和鼓励。但男友认为她父母和老师的做法情有可原，否则她不一定能考上这所大学。另外，他虽然支持女友继续保持对音乐的热情，但航思从他的言语之中感觉到，这份支持并非真心的祝福，而是因为一个“多才多艺”的女朋友让他很有面子。<br />  总之，在这三段关系和场景中，航思要么被管束、被评价，要么被忽视，她内心对自我的认识始终没有得到认可。红线随之越缠越多，也让最后一幕的挣脱有了分量。<br />  按照这样的故事大纲，策划团队的同学共同完成了剧本场景、对白的初稿。",
        key: true
      },
      {
        stage: "第三步",
        name: "修改打磨",
        text: "  初稿完成后，我负责剧本的二次修改，并在修改过程中与策划团队和其他同学进行交流进而继续调整。<br />  在初稿中，主角在每一幕都与对方发生争执，我认为这样太过刻板，也会让全剧缺少高潮迭起的层次感。更重要的是，三幕戏里面主角的处境是不同的，与父母、老师的对话发生在航思仍未承成年的学生时期，她的生活和学习都需要依赖父母师长，如果直截了当的开启争吵，最终也不会有什么结果，现实之中这样的争执也往往不了了之，以自己默默消化情绪收场。因此前两幕的争吵无论是从推进剧情角度和反映现实来说都没有太大的必要性。最终大家都同意将前两幕的争吵改为呈现主角不认可对方观点却又无奈接受的状态，这样更合理也更能体现剧本的主题，展现她被管束、评价的压抑。<br />  那么剧本的高潮则在第三幕，与恋爱中的男友争吵的时候发生。在这一幕中，主角面对的是同龄的男友，且此时她也已经成年，有了更多自己的体察，所以在这里爆发争吵就顺理成章。而且从观众的角度来看，戏剧中情侣吵架分手的场景也更吸引人，于是我们一致认为主角前两幕压抑和忍耐可以在这里得到释放。<br />  此外，关于剧本中人物的对白也一直在根据不同人的意见进行斟酌修改。比如一开始策划的时候，有同学认为可以做全法语的对白，但我认为观众不是所有人都能听懂，所以最终决定在最后一幕的时候才做法语歌曲的演唱展示，既能映衬剧本主题又能展现本系形象。还有后续确定角色以后，也根据扮演不同角色的同学的意见来微调对白，让句子更贴近真实的交谈或更有趣味性和幽默感。"
       
      },
      { stage: "第四步", name: "选角、排练与舞台设计", text: "  剧本定稿以后，角色根据自愿报名的形式来选择；但由于没有人选择出演女主角，经同学们的推举，我出演了这个角色。<br />  除了准备自己的表演，我也参与了排练的安排与协调。例如有些同学只参与最后的合唱部分，那么我们通常就会先组织排练最后一幕，把整体的部分练好，再按情况安排其他有戏份的同学排练，让没有戏份的同学可以尽早离开，避免大家在现场空等。<br />  此外，我也从航思这个角色出发，对其他角色的呈现和舞台的设计提出意见，和其他同学一同商议并判断怎样的呈现方式，比如对话的语气、某些道具的利用和摆放，能够更贴合更协调地展示这个话剧想要输出的内核。" },
      { stage: "第五步", name: "正式演出", text: "  经过一个月的剧本前期筹备和排练，《线》正式演出，并获得了二等奖的成绩。" },
      
    ]
  },
  {
    id: "er",
    tab: "爱心助学协会二手书义卖活动",
    title: "爱心助学协会二手书义卖活动",
    hook: "该项目是爱心助学协会发起的校园公益活动。号召同学们把闲置的旧书捐出，协会统一整理后低价义卖，所得款项全部用于为对接的贫困地区儿童购买文具、书包、课外读物和生活用品。一本对我们来说可能无用的旧书，可以变成孩子手中的一支笔或一件冬衣。我们希望让每位同学都能用最低的门槛参与公益，无论多少都是一份心意。",
    meta: ",
    steps: [
      { stage: "第一步", name: "立项与策划", text: "义卖活动是爱心助学协会历年都会举行的活动，每年的具体活动方案则由策划部门提出，并向协会各部门征求意见和建议。" },
      { stage: "第二步", name: "活动设计", text: "在征求意见的过程中，我提出了捐赠回馈和互动游戏的想法，经团队讨论后被采纳，并由我参与完善。<br /> 为激励和回馈捐赠书籍的同学，我们会发放学校周边明信片和特色书签；另外，捐书或直接捐款达到一定数目的同学，可以参与问答或者转盘小游戏获得奖励，比如可以去摊位上挑选若干本书，或者自选明信片、文具等小礼品。<br /> 这样的设计主要出于两方面的考虑，一是担心活动宣传力度和吸引力不足，希望这样可以激励同学们参与捐书活动；二是希望义卖活动举行的时候可以聚集多一些同学，让大家可以在现场了解协会举办活动的目的和意义，进而关注爱心助学的相关事宜。", key: true },
      { stage: "第三步", name: "书目整理与人手安排", text: "活动收集到的旧书数量可观，需要分门别类整理、登记。与此同时，部门成员在义卖期间不一定都有空，人手成了问题。经过商讨，我们决定开放自愿报名：协会成员（包括此前没有怎么参与活动的），以及协会以外的同学，都可以参加书籍整理与摆摊，并记志愿时长。我参与了大部分的清点整理和人手安排，带领并引导不熟悉流程的同学有序高效地进行工作。" },
      { stage: "第四步", name: "现场摆摊", text: "义卖活动持续了三天，每天都分成几个具体的时间段。三天内我参与了多个时间段的摊位组织和现场售卖，和协会成员与志愿者同学一同维护摊位秩序，号召经过的同学参与活动和游戏，并负责在活动收摊的时候整理物料、存放道具。" },
      { stage: "第五步", name: "数据清算", text: "义卖结束后，作为秘书部成员，我参与了数据的清算，并与负责对接贫困地区学生的助学部协作。我们把清点好的活动数据和资金交给助学部，助学部在后续将义卖所得资金的具体用途，比如购买了哪些文具，反馈给我们，由我们登记在册。" }
    ]
  }
];
    /* ===== 以下无需修改 ===== */
    var tabs = document.getElementById("tabs"), view = document.getElementById("view");

    function el(t, c, x) {
      var e = document.createElement(t);
      if (c) e.className = c;
      if (x) e.textContent = x;
      return e;
    }

    function render(id) {
      var p = PROJECTS.filter(function (q) { return q.id === id; })[0] || PROJECTS[0];
      Array.prototype.forEach.call(tabs.children, function (b) {
        b.setAttribute("aria-selected", b.dataset.id === p.id);
      });
      view.textContent = "";
      view.appendChild(el("p", "hook", p.hook));
      view.appendChild(el("p", "project-meta", p.meta));
      var ol = el("ol", "timeline");
      p.steps.forEach(function (s) {
        var li = el("li", s.key ? "key" : "");
        li.appendChild(el("p", "stage", s.stage));
        var h = el("h3", "", s.name);
        if (s.key) h.appendChild(el("span", "badge", "我的决策点"));
        li.appendChild(h);
        var b = el("div", "body");
        var textP = document.createElement("p");
textP.innerHTML = s.text;
b.appendChild(textP);
        if (s.todo) b.appendChild(el("div", "todo", "待回忆：" + s.todo));
        if (s.photo) b.appendChild(el("div", "photo", "【配图】" + s.photo));
        li.appendChild(b);
        ol.appendChild(li);
      });
      view.appendChild(ol);
    }

    PROJECTS.forEach(function (p) {
      var b = el("button", "", p.tab);
      b.setAttribute("role", "tab");
      b.dataset.id = p.id;
      b.onclick = function () {
        render(p.id);
        try { history.replaceState(null, "", "#" + p.id); } catch (e) {}
      };
      tabs.appendChild(b);
    });

    render(location.hash.slice(1));
    </script>
